name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Z3 (formal verification engine)
        run: pip install z3-solver || pip install --user z3-solver || pip install --break-system-packages z3-solver

      - name: Typecheck + build
        run: npm run build

      - name: Tests + formal verification (exhaustive + Z3)
        run: npm run verify

      - name: Regenerate examples — enforce seed determinism
        run: |
          npx tsx scripts/examples.mts
          git diff --exit-code examples motifs

      - name: Build docs site
        run: npm run docs

      - name: CLI smoke: generate → validate → render
        run: |
          npx tsx src/cli.ts generate --grid diamond:9 --symmetry C4 --seed ci --out /tmp/ci.kolam.json --render /tmp/ci.svg
          npx tsx src/cli.ts validate /tmp/ci.kolam.json
